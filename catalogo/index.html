function render(){
const parts=location.pathname.split("/").filter(Boolean);
const slug=parts[0]==="demo"?parts[1]:null;
const sector=slug?sectors.find(s=>s.slug===slug):null;
document.getElementById("app").innerHTML=slug&&demos[slug]?demos[slug]()+demoSalesCta(sector):catalog();
document.title=sector?sector.name+" — NoeApps Demo":"NoeApps — Catálogo web por sectores";
setTimeout(()=>document.querySelectorAll(".reveal").forEach((el,i)=>setTimeout(()=>el.classList.add("on"),i*55)),40);
}
const libraryState={items:[],visible:36,query:"",category:"",style:"",favoritesOnly:false};
const libraryFavorites=new Set(JSON.parse(localStorage.getItem("noeappsCatalogFavorites")||"[]"));
const compareIds=new Set();

function libraryEsc(v=""){return String(v).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
function libraryUrl(path=""){if(!path)return"#";if(/^https?:\/\//i.test(path))return path;return "/library/"+path.replace(/^\/+/, "")}
function absoluteCatalogUrl(path=""){try{return new URL(path,location.origin).toString()}catch(e){return location.origin+"/"}}
function catalogBuilderUrl(x){
 const href=libraryUrl(x.preview||x.source_url);
 const q=new URLSearchParams({
   catalogDesign:String(x.id||""),
   catalogName:String(x.commercial_name||x.title||"Diseño NoeApps"),
   catalogCategory:String(x.category||""),
   catalogPreview:absoluteCatalogUrl(href),
   catalogThumb:x.thumbnail?absoluteCatalogUrl(libraryUrl(x.thumbnail)):"",
   catalogStyles:(x.style||[]).join(","),
   catalogFormat:String(x.format||""),
   catalogSource:String(x.source_name||x.source||""),
   catalogImpact:String(x.impact_score||0)
 });
 return "https://personalizar.noeapps.com/?"+q.toString();
}
function sectorBuilderUrl(s){
 const q=new URLSearchParams({
   catalogDesign:"noeapps-sector-"+s.slug,
   catalogName:s.name,
   catalogCategory:s.name,
   catalogPreview:absoluteCatalogUrl("/demo/"+s.slug),
   catalogThumb:s.img,
   catalogStyles:s.tag,
   catalogFormat:"One Page",
   catalogSource:"NoeApps Original",
   catalogImpact:"25"
 });
 return "https://personalizar.noeapps.com/?"+q.toString();
}
function demoSalesCta(s){return s?'<a class="demo-sales-cta" href="'+sectorBuilderUrl(s)+'">Quiero una web como esta <span>→</span></a>':""}
function libraryFiltered(){
 const q=libraryState.query.trim().toLowerCase();
 return libraryState.items.filter(x=>{
   const cat=!libraryState.category||x.category===libraryState.category;
   const sty=!libraryState.style||(x.style||[]).includes(libraryState.style);
   const fav=!libraryState.favoritesOnly||libraryFavorites.has(x.id);
   const hay=[x.commercial_name,x.title,x.original_title,x.category,x.format,...(x.style||[]),...(x.tags||[])].join(" ").toLowerCase();
   return cat&&sty&&fav&&(!q||hay.includes(q));
 });
}
function libraryCard(x){
 const thumb=x.thumbnail?'<img loading="lazy" decoding="async" src="'+libraryEsc(libraryUrl(x.thumbnail))+'" alt="">':'<div class="library-fallback"><b>'+libraryEsc((x.category||"N").charAt(0))+'</b><small>'+libraryEsc(x.category||"Diseño")+'</small></div>';
 const tags=[...(x.style||[]).slice(0,2),x.format].filter(Boolean);
 const fav=libraryFavorites.has(x.id);
 const href=libraryUrl(x.preview||x.source_url);
 const name=x.commercial_name||x.title||"Diseño NoeApps";
 const live=Boolean(x.preview&&((x.style||[]).includes("Impacto")||(x.impact_score||0)>=12));
 const wow=(x.impact_score||0)>=17;
 return '<article class="library-card '+(live?'has-live':'')+'" data-template-id="'+libraryEsc(x.id)+'" '+(live?'data-live-preview="'+libraryEsc(href)+'"':'')+'><div class="library-shot">'+thumb+(wow?'<span class="wow-pill">WOW</span>':'')+'<span class="library-sector">'+libraryEsc(x.category||"Otros")+'</span><button class="library-fav '+(fav?'on':'')+'" data-lib-fav="'+libraryEsc(x.id)+'" type="button">♥</button></div><div class="library-body"><h3>'+libraryEsc(name)+'</h3><div class="library-tags">'+tags.map(t=>'<span>'+libraryEsc(t)+'</span>').join("")+'</div><div class="library-actions"><button class="quick-view" data-quick-view="'+libraryEsc(x.id)+'" type="button">Vista rápida</button><a href="'+libraryEsc(href)+'" target="_blank" rel="noopener">Abrir demo ↗</a><button class="compare-add '+(compareIds.has(x.id)?'on':'')+'" data-compare="'+libraryEsc(x.id)+'" type="button">Comparar</button><a class="catalog-sales-cta" href="'+libraryEsc(catalogBuilderUrl(x))+'">Quiero una web como esta →</a></div></div></article>';
}
function renderLibrary(reset=false){
 if(reset)libraryState.visible=36;
 const items=libraryFiltered(),shown=items.slice(0,libraryState.visible);
 const grid=document.getElementById("libraryGrid");
 if(!grid)return;
 grid.innerHTML=shown.map(libraryCard).join("");
 document.getElementById("libraryEmpty").classList.toggle("show",items.length===0);
 const more=document.getElementById("libraryMore");
 more.style.display=shown.length>=items.length?"none":"inline-flex";
 document.getElementById("libraryFavorites").textContent="♥ Favoritos ("+libraryFavorites.size+")";
}
function renderImpact(){
 const section=document.getElementById("impactSpotlight"),grid=document.getElementById("impactGrid");
 if(!section||!grid)return;
 const ranked=[...libraryState.items].sort((a,b)=>(b.impact_score||0)-(a.impact_score||0));
 const byCategory=new Map();
 ranked.forEach(x=>{if(!byCategory.has(x.category))byCategory.set(x.category,[]);byCategory.get(x.category).push(x)});
 const cats=[...byCategory.keys()].sort((a,b)=>{
   const sa=byCategory.get(a)?.[0]?.impact_score||0,sb=byCategory.get(b)?.[0]?.impact_score||0;
   return sb-sa;
 });
 const items=[];
 for(let round=0;items.length<12&&round<3;round++){
   for(const cat of cats){
     const x=byCategory.get(cat)?.[round];
     if(x)items.push(x);
     if(items.length>=12)break;
   }
 }
 section.hidden=items.length===0;
 grid.innerHTML=items.map(libraryCard).join("");
}
function fillLibraryFilters(){
 const cats=[...new Set(libraryState.items.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
 const styles=[...new Set(libraryState.items.flatMap(x=>x.style||[]))].sort((a,b)=>a.localeCompare(b,"es"));
 document.getElementById("libraryCategory").innerHTML='<option value="">Todos los sectores</option>'+cats.map(x=>'<option>'+libraryEsc(x)+'</option>').join("");
 document.getElementById("libraryStyle").innerHTML='<option value="">Todos los estilos</option>'+styles.map(x=>'<option>'+libraryEsc(x)+'</option>').join("");
 document.getElementById("libraryCount").textContent=libraryState.items.length+" diseños de alto impacto";
 document.getElementById("categoryCount").textContent=cats.length+" sectores";
 document.getElementById("impactCount").textContent=libraryState.items.length+" seleccionados";
 document.getElementById("totalCatalogCount").textContent=libraryState.items.length+sectors.length;
}
let activeSelection=null;

function encodeSelectionPayload(payload){
 const raw=unescape(encodeURIComponent(JSON.stringify(payload)));
 return btoa(raw).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodeSelectionPath(){
 const parts=location.pathname.split("/").filter(Boolean);
 if(parts[0]!=="seleccion"||!parts[1])return null;
 try{
   let token=parts[1].replace(/-/g,"+").replace(/_/g,"/");
   while(token.length%4)token+="=";
   const raw=decodeURIComponent(escape(atob(token)));
   const data=JSON.parse(raw);
   if(!Array.isArray(data.ids)||!data.ids.length)return null;
   return {name:String(data.n||"Cliente").slice(0,80),ids:data.ids.map(String).slice(0,20)};
 }catch(e){return null}
}
function showShareToast(message){
 const el=document.getElementById("shareToast"); if(!el)return;
 el.textContent=message; el.classList.add("on");
 clearTimeout(showShareToast.t); showShareToast.t=setTimeout(()=>el.classList.remove("on"),2200);
}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){}
 const area=document.createElement("textarea"); area.value=text; document.body.appendChild(area); area.select();
 try{document.execCommand("copy");area.remove();return true}catch(e){area.remove();return false}
}
async function shareSelection(){
 if(activeSelection){
   await copyText(location.href);
   showShareToast("Enlace de selección copiado");
   return;
 }
 const ids=[...libraryFavorites].filter(id=>libraryState.items.some(x=>x.id===id));
 if(!ids.length){showShareToast("Marca primero tus favoritos ♥");return}
 const name=prompt("Nombre del cliente para esta selección:","Cliente");
 if(name===null)return;
 const token=encodeSelectionPayload({n:name.trim()||"Cliente",ids});
 const url=location.origin+"/seleccion/"+token;
 await copyText(url);
 showShareToast("Selección para "+(name.trim()||"Cliente")+" copiada");
}
function enableLivePreviews(){
 if(!matchMedia("(hover:hover) and (pointer:fine)").matches)return;
 let timer=null,active=null;
 document.addEventListener("mouseover",e=>{
   const card=e.target.closest(".library-card[data-live-preview]");
   if(!card||card===active)return;
   clearTimeout(timer);
   timer=setTimeout(()=>{
     const shot=card.querySelector(".library-shot"); if(!shot||card.querySelector(".library-live-preview"))return;
     const frame=document.createElement("iframe");
     frame.className="library-live-preview";
     frame.setAttribute("sandbox","allow-scripts");
     frame.setAttribute("aria-hidden","true");
     frame.src=card.dataset.livePreview;
     const scale=(shot.clientWidth||320)/960;
     frame.style.transform="scale("+scale+")";
     shot.appendChild(frame); active=card;
   },420);
 });
 document.addEventListener("mouseout",e=>{
   const card=e.target.closest(".library-card[data-live-preview]"); if(!card)return;
   if(e.relatedTarget&&card.contains(e.relatedTarget))return;
   clearTimeout(timer);
   const frame=card.querySelector(".library-live-preview");
   if(frame)frame.remove();
   if(active===card)active=null;
 });
}
function surpriseMe(){
 const pool=libraryState.items.filter(x=>(x.impact_score||0)>=17&&x.preview);
 const source=pool.length?pool:libraryState.items.filter(x=>x.preview);
 if(!source.length){showShareToast("No hay demos disponibles");return}
 const pick=source[Math.floor(Math.random()*source.length)];
 window.open(libraryUrl(pick.preview),"_blank","noopener");
}
function updateCompareDock(){
 const dock=document.getElementById("compareDock"),count=document.getElementById("compareCount");
 if(!dock||!count)return;
 count.textContent=compareIds.size+" diseño"+(compareIds.size===1?"":"s");
 dock.classList.toggle("on",compareIds.size>0);
 const open=document.getElementById("compareOpen"); if(open)open.disabled=compareIds.size<2;
 document.querySelectorAll("[data-compare]").forEach(b=>b.classList.toggle("on",compareIds.has(b.dataset.compare)));
}
function toggleCompare(id){
 if(compareIds.has(id))compareIds.delete(id);
 else{
   if(compareIds.size>=4){showShareToast("Máximo 4 diseños para comparar");return}
   compareIds.add(id);
 }
 updateCompareDock();
}
function compareThumb(x){
 return x.thumbnail?'<img loading="eager" decoding="async" src="'+libraryEsc(libraryUrl(x.thumbnail))+'" alt="">':'<div class="library-fallback"><b>'+libraryEsc((x.category||"N").charAt(0))+'</b><small>'+libraryEsc(x.category||"Diseño")+'</small></div>';
}
function openCompare(){
 const items=[...compareIds].map(id=>libraryState.items.find(x=>x.id===id)).filter(Boolean);
 if(items.length<2){showShareToast("Selecciona al menos 2 diseños");return}
 const modal=document.getElementById("compareModal"),grid=document.getElementById("compareGrid");
 if(!modal||!grid)return;
 grid.style.setProperty("--compare-cols",String(Math.min(items.length,4)));
 grid.innerHTML=items.map(x=>{
   const name=libraryEsc(x.commercial_name||x.title||"Diseño NoeApps");
   const href=libraryEsc(libraryUrl(x.preview||x.source_url));
   const styles=(x.style||[]).map(t=>'<span>'+libraryEsc(t)+'</span>').join("");
   const impact=Math.max(0,Math.min(100,Math.round(((x.impact_score||0)/26)*100)));
   const source=libraryEsc(x.source_name||x.source||"NoeApps");
   const license=libraryEsc(x.license||"—");
   return '<section class="compare-pane"><div class="compare-pane-head"><strong>'+name+'</strong><small>'+libraryEsc(x.category||"")+'</small></div><div class="compare-shot">'+compareThumb(x)+'</div><div class="compare-details"><div class="compare-row"><span>Formato</span><strong>'+libraryEsc(x.format||"—")+'</strong></div><div class="compare-row"><span>Origen</span><strong>'+source+'</strong></div><div class="compare-row"><span>Licencia</span><strong>'+license+'</strong></div><div><span style="display:block;color:#7f8a99;font:700 9px Inter;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">Estilos</span><div class="compare-tags">'+styles+'</div></div><div class="compare-impact"><span style="color:#7f8a99;font:700 9px Inter;text-transform:uppercase">Impacto</span><div class="compare-impact-track"><i style="--impact:'+impact+'%"></i></div><strong style="font:800 10px Inter">'+String(x.impact_score||0)+'/26</strong></div><div class="compare-actions"><button type="button" data-quick-view="'+libraryEsc(x.id)+'">Vista rápida</button><a href="'+href+'" target="_blank" rel="noopener">Abrir demo ↗</a><a class="compare-sales" href="'+libraryEsc(catalogBuilderUrl(x))+'">Quiero esta web →</a></div></div></section>';
 }).join("");
 modal.classList.add("on"); document.body.style.overflow="hidden";
}
function closeCompare(){
 const modal=document.getElementById("compareModal"),grid=document.getElementById("compareGrid");
 if(modal)modal.classList.remove("on"); if(grid)grid.innerHTML=""; document.body.style.overflow="";
}
function openQuickView(id){
 const x=libraryState.items.find(item=>item.id===id); if(!x)return;
 const modal=document.getElementById("quickModal"),card=document.getElementById("quickCard"); if(!modal||!card)return;
 const name=libraryEsc(x.commercial_name||x.title||"Diseño NoeApps");
 const href=libraryEsc(libraryUrl(x.preview||x.source_url));
 const styles=(x.style||[]).map(t=>'<span>'+libraryEsc(t)+'</span>').join("");
 const img=x.thumbnail?'<img src="'+libraryEsc(libraryUrl(x.thumbnail))+'" alt="">':'<div class="library-fallback"><b>'+libraryEsc((x.category||"N").charAt(0))+'</b><small>'+libraryEsc(x.category||"Diseño")+'</small></div>';
 card.innerHTML='<div class="quick-head"><strong>Vista rápida</strong><button class="quick-close" type="button" aria-label="Cerrar">×</button></div><div class="quick-content"><div class="quick-image">'+img+'</div><div class="quick-info"><div class="cat-kicker">'+libraryEsc(x.category||"Diseño")+' · '+libraryEsc(x.format||"Web")+'</div><h3>'+name+'</h3><p>Previsualización segura del diseño. Aquí no ejecutamos la web para evitar romper animaciones o dependencias. Usa «Abrir web» para verla funcionando.</p><div class="compare-tags">'+styles+'</div><div class="compare-row"><span>Origen</span><strong>'+libraryEsc(x.source_name||x.source||"NoeApps")+'</strong></div><div class="compare-row"><span>Impacto</span><strong>'+String(x.impact_score||0)+'/26</strong></div><a class="quick-open" href="'+href+'" target="_blank" rel="noopener">Abrir demo real ↗</a><a class="quick-sales" href="'+libraryEsc(catalogBuilderUrl(x))+'">Quiero una web como esta →</a></div></div>';
 modal.classList.add("on"); document.body.style.overflow="hidden";
}
function closeQuickView(){
 const modal=document.getElementById("quickModal"),card=document.getElementById("quickCard");
 if(modal)modal.classList.remove("on"); if(card)card.innerHTML=""; 
 if(!document.getElementById("compareModal")?.classList.contains("on"))document.body.style.overflow="";
}
async function initLibrary(){
 try{
   const r=await fetch("/catalog-data",{cache:"no-store"});
   if(!r.ok)throw new Error("catalog data unavailable");
   const data=await r.json();
   const allItems=Array.isArray(data)?data:(data.templates||[]);
   activeSelection=decodeSelectionPath();
   const visualFallback=x=>{
     const styles=x.style||[];
     const sid=x.source_id||"";
     const hay=[x.title,x.original_title,...(x.tags||[])].join(" ").toLowerCase();
     const forbidden=["ecommerce","e-commerce","shop","store","shopping","cart","checkout","booking","reservation","rsvp","order now"];
     if(forbidden.some(term=>hay.includes(term)))return false;
     return x.showcase===true
       || styles.some(s=>["3D","Animado","Experimental"].includes(s))
       || (styles.includes("Premium")&&styles.length>1)
       || sid.startsWith("formwork-")
       || sid.startsWith("codrops-")
       || sid.startsWith("awwwards3d-");
   };
   let curated=allItems.filter(x=>x.showcase!==false&&visualFallback(x))
     .sort((a,b)=>(b.impact_score||0)-(a.impact_score||0));

   if(activeSelection){
     const wanted=new Set(activeSelection.ids);
     curated=allItems.filter(x=>wanted.has(x.id));
     const collection=document.getElementById("noeappsCollection"); if(collection){collection.hidden=true;collection.style.display="none";}
     const spotlight=document.getElementById("impactSpotlight"); if(spotlight)spotlight.hidden=true;
     const controls=document.querySelector(".library-controls"); if(controls)controls.style.display="none";
     const heroTitle=document.querySelector(".cat-hero h1"); if(heroTitle)heroTitle.innerHTML='Selección para <span>'+libraryEsc(activeSelection.name)+'</span>.';
     const heroCopy=document.querySelector(".cat-hero p"); if(heroCopy)heroCopy.textContent="Una selección privada de diseños NoeApps preparada para comparar estilos y elegir una dirección visual.";
     const banner=document.getElementById("selectionBanner");
     if(banner){banner.hidden=false;banner.innerHTML='<div><strong>Selección privada · '+libraryEsc(activeSelection.name)+'</strong><span>'+curated.length+' propuestas seleccionadas</span></div><button id="copyCurrentSelection" type="button">Copiar enlace</button>';}
     const libraryTitle=document.querySelector(".library-head h2"); if(libraryTitle)libraryTitle.innerHTML="Propuestas<br>seleccionadas.";
     const share=document.getElementById("shareSelectionBtn"); if(share)share.textContent="Copiar selección";
   }

   libraryState.items=curated;
   fillLibraryFilters(); renderImpact(); renderLibrary(true);
   if(activeSelection){
     const spotlight=document.getElementById("impactSpotlight"); if(spotlight)spotlight.hidden=true;
     document.getElementById("copyCurrentSelection")?.addEventListener("click",shareSelection);
   }
   document.getElementById("librarySearch").addEventListener("input",e=>{libraryState.query=e.target.value;renderLibrary(true)});
   document.getElementById("libraryCategory").addEventListener("change",e=>{libraryState.category=e.target.value;renderLibrary(true)});
   document.getElementById("libraryStyle").addEventListener("change",e=>{libraryState.style=e.target.value;renderLibrary(true)});
   document.getElementById("libraryFavorites").addEventListener("click",()=>{libraryState.favoritesOnly=!libraryState.favoritesOnly;renderLibrary(true)});
   document.getElementById("libraryMore").addEventListener("click",()=>{libraryState.visible+=36;renderLibrary()});
   const favHandler=e=>{
     const b=e.target.closest("[data-lib-fav]"); if(!b)return;
     const id=b.dataset.libFav;
     if(libraryFavorites.has(id))libraryFavorites.delete(id);else libraryFavorites.add(id);
     localStorage.setItem("noeappsCatalogFavorites",JSON.stringify([...libraryFavorites]));
     renderImpact(); renderLibrary();
   };
   document.getElementById("impactGrid")?.addEventListener("click",favHandler);
   document.getElementById("libraryGrid").addEventListener("click",e=>{
     const b=e.target.closest("[data-lib-fav]"); if(!b)return;
     const id=b.dataset.libFav;
     if(libraryFavorites.has(id))libraryFavorites.delete(id);else libraryFavorites.add(id);
     localStorage.setItem("noeappsCatalogFavorites",JSON.stringify([...libraryFavorites]));
     renderImpact(); renderLibrary();
   });
   document.getElementById("shareSelectionBtn")?.addEventListener("click",shareSelection);
   document.getElementById("surpriseBtn")?.addEventListener("click",surpriseMe);
   document.addEventListener("click",e=>{
     const quick=e.target.closest("[data-quick-view]");
     if(quick){e.preventDefault();e.stopPropagation();openQuickView(quick.dataset.quickView);return}
     const b=e.target.closest("[data-compare]"); if(!b)return;
     e.preventDefault(); e.stopPropagation(); toggleCompare(b.dataset.compare);
   });
   document.getElementById("compareOpen")?.addEventListener("click",openCompare);
   document.getElementById("compareClear")?.addEventListener("click",()=>{compareIds.clear();updateCompareDock();});
   document.getElementById("compareClose")?.addEventListener("click",closeCompare);
   document.getElementById("compareModal")?.addEventListener("click",e=>{if(e.target.id==="compareModal")closeCompare();});
   document.getElementById("quickModal")?.addEventListener("click",e=>{if(e.target.id==="quickModal"||e.target.closest(".quick-close"))closeQuickView();});
   document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeQuickView();closeCompare();}});
   updateCompareDock();
   enableLivePreviews();
 }catch(err){
   const c=document.getElementById("libraryCount"); if(c)c.textContent="Biblioteca no disponible";
   console.warn(err);
 }
}

render();
if(!location.pathname.startsWith('/demo/')) initLibrary();
</script>
