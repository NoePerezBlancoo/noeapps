<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Catálogo · NoeApps</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#f5f7fb;font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);padding:28px;border:1px solid #29313b;border-radius:20px;background:#10151c}.card span{font-size:10px;letter-spacing:.15em;color:#8290a0;font-weight:900}.card h1{font-size:42px;letter-spacing:-.06em;margin:10px 0 20px}.card input{width:100%;padding:13px;border-radius:10px;border:1px solid #303947;background:#0b0f14;color:#fff}.card button{width:100%;margin-top:12px;height:46px;border:0;border-radius:10px;background:#6f62ff;color:#fff;font-weight:900}.app{display:none}.top{display:flex;justify-content:space-between;align-items:end;padding:25px 30px;border-bottom:1px solid #202630}.top h1{margin:4px 0 0;font-size:36px}.top span{color:#7c8797;font-size:10px;letter-spacing:.14em}.top button{background:#161c24;color:#dce2e9;border:1px solid #303846;padding:9px 12px;border-radius:8px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 30px}.metric{padding:15px;border:1px solid #252c36;border-radius:13px;background:#0f141b}.metric span{font-size:9px;color:#788495;text-transform:uppercase}.metric b{display:block;font-size:26px;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 1.05fr;min-height:calc(100vh - 170px);border-top:1px solid #202630}.list{border-right:1px solid #202630;padding:16px;overflow:auto}.row{width:100%;display:grid;grid-template-columns:1.2fr .8fr auto;gap:12px;text-align:left;padding:14px;margin-bottom:8px;border:1px solid #252d37;border-radius:12px;background:#0d1218;color:#fff;cursor:pointer}.row.active{border-color:#7064ff;background:#121527}.row strong,.row small{display:block}.row small{margin-top:3px;color:#7d8999}.row em{font-style:normal;color:#a9b4c3;font-size:11px}.pill{align-self:center;padding:6px 8px;border-radius:999px;background:#1b222c;font-size:9px;text-transform:uppercase}.detail{padding:24px 28px;overflow:auto}.detail h2{font-size:34px;margin:5px 0 4px}.detail .sub{color:#8490a0;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.box{padding:13px;border:1px solid #252d37;border-radius:11px;background:#0e1319}.box span{display:block;color:#778394;font-size:9px;text-transform:uppercase;font-weight:800}.box p{margin:6px 0 0;white-space:pre-wrap;font-size:12px}.field{display:block;margin-top:12px}.field span{display:block;color:#8e99a8;font-size:9px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #303947;background:#0b0f14;color:#fff;border-radius:9px;padding:10px}.field textarea{min-height:86px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.actions button,.actions a{padding:10px 12px;border-radius:9px;border:1px solid #303947;background:#151b23;color:#fff;text-decoration:none;font-size:10px;font-weight:800}.actions .primary{background:#6f62ff;border-color:#6f62ff}.empty{padding:50px;color:#758090;text-align:center}.msg{color:#ffb0b0;font-size:11px;margin-top:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid #202630}.metrics{grid-template-columns:1fr 1fr}.top{padding:20px}.metrics{padding:14px}.detail{padding:18px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}}</style></head>
<body>
<section class="login" id="login"><form class="card" id="loginForm"><span>NOEAPPS · CATÁLOGO CRM</span><h1>Solicitudes.</h1><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button>Entrar →</button><div id="loginMsg" class="msg"></div></form></section>
<main class="app" id="app"><header class="top"><div><span>NOEAPPS · CATÁLOGO WEB</span><h1>CRM independiente</h1></div><div><button id="refresh">Actualizar</button> <button id="logout">Salir</button></div></header>
<section class="metrics"><article class="metric"><span>Total</span><b id="mTotal">0</b></article><article class="metric"><span>Nuevas</span><b id="mNew">0</b></article><article class="metric"><span>En preparación</span><b id="mPrep">0</b></article><article class="metric"><span>Pagadas</span><b id="mPaid">0</b></article></section>
<div class="layout"><section class="list" id="list"></section><aside class="detail" id="detail"><div class="empty">Selecciona una solicitud.</div></aside></div></main>
<script>
let items=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error('Sesión cerrada')}if(!r.ok)throw new Error(j.error||'Error');return j}
function showLogin(){document.getElementById('login').style.display='grid';document.getElementById('app').style.display='none'}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}
async function load(){try{const j=await api('/api/crm/requests');items=j.requests||[];showApp();renderList();metrics();if(selected){selected=items.find(x=>x.id===selected.id)||null;renderDetail()}}catch{}}
function metrics(){document.getElementById('mTotal').textContent=items.length;document.getElementById('mNew').textContent=items.filter(x=>x.status==='new').length;document.getElementById('mPrep').textContent=items.filter(x=>['preparing','preview_ready','sent'].includes(x.status)).length;document.getElementById('mPaid').textContent=items.filter(x=>x.status==='paid').length}
function renderList(){const el=document.getElementById('list');if(!items.length){el.innerHTML='<div class="empty">Todavía no hay solicitudes.</div>';return}el.innerHTML=items.map(x=>'<button class="row '+(selected&&selected.id===x.id?'active':'')+'" data-id="'+x.id+'"><div><strong>'+esc(x.business_name)+'</strong><small>'+esc(x.contact_name)+' · '+new Date(x.created_at).toLocaleDateString('es-ES')+'</small></div><div><em>'+esc(x.design_name)+'</em><small>'+esc(x.creation_price)+' € + 19,90 €/mes</small></div><span class="pill">'+esc(x.status)+'</span></button>').join('');el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=items.find(x=>x.id===b.dataset.id);renderList();renderDetail()})}
function renderDetail(){const el=document.getElementById('detail');if(!selected){el.innerHTML='<div class="empty">Selecciona una solicitud.</div>';return}const wa=String(selected.whatsapp||'').replace(/\D/g,'');const text=encodeURIComponent('Hola '+selected.contact_name+', ya tenemos preparada tu web.\n\nPreview: '+(selected.preview_url||'')+'\n\nActivación/pago: '+(selected.payment_url||''));el.innerHTML='<div class="sub">Solicitud '+esc(selected.id.slice(0,8).toUpperCase())+'</div><h2>'+esc(selected.business_name)+'</h2><div class="sub">'+esc(selected.design_name)+' · creación '+esc(selected.creation_price)+' € · después 19,90 €/mes</div><div class="grid"><div class="box"><span>Contacto</span><p>'+esc(selected.contact_name)+'\n'+esc(selected.whatsapp)+'\n'+esc(selected.email||'')+'</p></div><div class="box"><span>Negocio</span><p>'+esc(selected.city||'')+'\n'+esc(selected.source_url||'')+'</p></div><div class="box"><span>Diseño</span><p>'+esc(selected.category||'')+' · '+esc(selected.tier||'')+'</p></div><div class="box"><span>Notas cliente</span><p>'+esc(selected.notes||'—')+'</p></div></div><label class="field"><span>Estado</span><select id="status">'+['new','preparing','preview_ready','sent','paid','published','closed'].map(s=>'<option '+(selected.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field"><span>Enlace preview</span><input id="previewUrl" value="'+esc(selected.preview_url||'')+'" placeholder="https://..."></label><label class="field"><span>Enlace de pago</span><input id="paymentUrl" value="'+esc(selected.payment_url||'')+'" placeholder="https://..."></label><label class="field"><span>Notas internas</span><textarea id="adminNotes">'+esc(selected.admin_notes||'')+'</textarea></label><div class="actions"><button class="primary" id="save">Guardar cambios</button>'+(selected.catalog_preview_url?'<a target="_blank" href="'+esc(selected.catalog_preview_url)+'">Ver diseño ↗</a>':'')+(wa?'<a target="_blank" href="https://wa.me/'+wa+'?text='+text+'">Abrir WhatsApp ↗</a>':'')+'</div><div id="detailMsg" class="msg"></div>';document.getElementById('save').onclick=save}
async function save(){const m=document.getElementById('detailMsg');m.textContent='';try{const j=await api('/api/crm/requests/'+selected.id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('status').value,previewUrl:document.getElementById('previewUrl').value,paymentUrl:document.getElementById('paymentUrl').value,adminNotes:document.getElementById('adminNotes').value})});selected=j.request;await load()}catch(e){m.textContent=e.message}}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('loginMsg');m.textContent='';try{await api('/api/crm/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';await load()}catch(e){m.textContent=e.message}};
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await fetch('/api/crm/logout',{method:'POST'});showLogin()};load();
</script></body></html>
